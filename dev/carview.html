<!doctype html>
<html><head><meta charset="utf-8"><title>Car viewer</title>
<script type="importmap">{ "imports": { "three": "../vendor/three/three.module.js", "three/addons/": "../vendor/three/addons/" } }</script>
<style>body{margin:0;background:#222}canvas{display:block}</style></head><body>
<script type="module">
// Dev-only: renders a car from four angles. Usage: dev/carview.html?car=vanta&doors=1
import * as THREE from "three";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { makeCar, setDoors } from "../src/carmodel.js";
import { carById } from "../src/cars.js";
const q = new URLSearchParams(location.search);
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); r.setSize(1000, 700); document.body.appendChild(r.domElement);
r.toneMapping = THREE.ACESFilmicToneMapping; r.setScissorTest(true);
const s = new THREE.Scene(); s.background = new THREE.Color(0x3a4050);
s.environment = new THREE.PMREMGenerator(r).fromScene(new RoomEnvironment(), 0.04).texture;
s.add(new THREE.HemisphereLight(0xffffff, 0x333333, 1)); const d = new THREE.DirectionalLight(0xffffff, 2); d.position.set(3, 6, 4); s.add(d);
const car = makeCar(carById(q.get("car") || "vanta"), 0x0f8b8d); s.add(car.group); setDoors(car, Number(q.get("doors") || 0));
const grid = new THREE.GridHelper(10, 20); s.add(grid);
const cam = new THREE.PerspectiveCamera(30, 500 / 350, 0.1, 100);
const views = [[[9, 1.2, 0.01], 0, 350], [[6, 3, 7], 500, 350], [[0.01, 1.2, 9], 0, 0], [[-5, 4, -7], 500, 0]];
for (const [p, x, y] of views) { cam.position.set(...p); cam.lookAt(0, 0.6, 0); r.setViewport(x, y, 500, 350); r.setScissor(x, y, 500, 350); r.render(s, cam); }
window.done = true;
</script></body></html>
