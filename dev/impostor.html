<!doctype html>
<!-- Bakes tree impostors: renders a glTF model from the side onto a transparent canvas. Driven by scripts/dev/impostors.mjs. -->
<html><head><meta charset="utf-8">
<script type="importmap">{ "imports": { "three": "../node_modules/three/build/three.module.js", "three/addons/": "../node_modules/three/examples/jsm/" } }</script>
</head><body style="margin:0;background:transparent">
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
const W = 512, H = 1024;
const r = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
r.setSize(W, H); r.setClearColor(0x000000, 0); r.outputColorSpace = THREE.SRGBColorSpace; r.toneMapping = THREE.ACESFilmicToneMapping; r.toneMappingExposure = 1.3;
document.body.appendChild(r.domElement);
const models = {};
// variants(url): how many separate trees the file holds (top-level objects, side by side in Poly Haven sets)
const parts = (root) => { let k = root; while (k.children.length === 1 && !k.isMesh) k = k.children[0]; return k.isMesh ? [k] : k.children; };
window.variants = async (url) => { if (!models[url]) models[url] = await new GLTFLoader().loadAsync(url); return parts(models[url].scene).length; };
window.bake = async (url, idx = 0) => {
  const scene = new THREE.Scene();
  scene.add(new THREE.HemisphereLight(0xd8e6ff, 0x4a4030, 1.3));
  const sun = new THREE.DirectionalLight(0xfff1dc, 2.6); sun.position.set(-3, 5, 4); scene.add(sun);
  if (!models[url]) models[url] = await new GLTFLoader().loadAsync(url);
  const ps = parts(models[url].scene), m = idx < 0 ? models[url].scene : ps[idx]; // idx -1: the whole file is one tree
  const holder = m.clone(); holder.updateMatrixWorld(true);
  holder.traverse((o) => { if (o.isMesh) { const mats = Array.isArray(o.material) ? o.material : [o.material]; mats.forEach((mt) => { mt.side = THREE.DoubleSide; if (mt.alphaMap || mt.transparent || mt.alphaTest) { mt.alphaTest = 0.4; mt.transparent = false; } }); } });
  scene.add(holder);
  const box = new THREE.Box3().setFromObject(holder), size = box.getSize(new THREE.Vector3()), c = box.getCenter(new THREE.Vector3());
  const half = Math.max(size.y / 2, (Math.max(size.x, size.z) / 2) * (H / W)) * 1.02;
  const cam = new THREE.OrthographicCamera(-half * W / H, half * W / H, half, -half, 0.1, 1000);
  cam.position.set(c.x, c.y, c.z + 200); cam.lookAt(c.x, c.y, c.z);
  r.render(scene, cam);
  // base: where the ground (bottom of the model) is, as a fraction up from the bottom of the image; extent = metres the image covers
  return { url: r.domElement.toDataURL("image/png"), base: (box.min.y - (c.y - half)) / (2 * half), extent: 2 * half, height: size.y };
};
window.ready = true;
</script></body></html>
