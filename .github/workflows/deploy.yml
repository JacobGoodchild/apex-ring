name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check vendored Three.js matches package.json
        run: npm run vendor && git diff --exit-code vendor/
      - name: Check sw.js file list is up to date
        run: npm run sw && git diff --exit-code sw.js
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: |
            screenshots/
            test-results/
          if-no-files-found: ignore

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Stamp the version and rebuild the offline file list
        run: node scripts/version.mjs && node scripts/sw.mjs
      - name: Collect site files
        run: |
          mkdir -p _site
          cp -r index.html styles.css src vendor _site/
          for f in manifest.webmanifest sw.js icons CREDITS.md; do [ -e "$f" ] && cp -r "$f" _site/ || true; done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
